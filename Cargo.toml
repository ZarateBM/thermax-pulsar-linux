[package]
name = "thermax-pulsar"
version = "0.1.0"
edition = "2021"
authors = ["Brandon <thermax-pulsar-linux>"]
description = "Lightweight Linux daemon for THERMAX 6 PULSAR CPU cooler display (XYZ-WC-AQUA)"
readme = "README.md"
license = "MIT"

[dependencies]
hidapi = { version = "2.6", default-features = false, features = ["linux-static-hidraw"] }
sysinfo = "0.33"
chrono = "0.4"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
clap = { version = "4.5", features = ["derive"] }
log = "0.4"
env_logger = "0.11"
ctrlc = "3.4"
